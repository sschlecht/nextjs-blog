# Pages CMS configuration: https://pagescms.org/docs/
media:
  input: public/images
  output: /images
  categories: ["image"]

content:
  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    view:
      fields: [title, date, status]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: seoTitle
        label: Title tag (SEO browser title)
        type: string
      - name: description
        label: Meta description (shown in Google results and post lists, ~150 chars)
        type: text
      - name: author
        label: Author
        type: object
        fields:
          - name: name
            label: Author name
            type: string
          - name: avatar
            label: Author photo
            type: image
            options:
              path: public/images/authors
      - name: date
        label: Publish date
        type: date
        required: true
      - name: status
        label: Status (Draft stays hidden; Published goes live)
        type: select
        default: draft
        required: true
        options:
          values: [draft, published]
      - name: coverImage
        label: Cover image
        type: image
        options:
          path: public/images/blog
      - name: body
        label: Post
        type: rich-text
        options:
          path: public/images/blog
          rename: true
          switcher: true